name: gym_app
description: "Easy Set: offline-first gym tracker with Google account backup."
publish_to: 'none'
# name+build. Bump the build number (after the +) for every Google Play upload.
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  fl_chart: ^1.1.0
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  google_sign_in: ^7.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

dependency_overrides:
  # fl_chart 1.1 calls Matrix4.translateByDouble/scaleByDouble (vector_math 2.2+),
  # but Flutter 3.32 pins vector_math 2.1.4. Drop this once Flutter ships 2.2+.
  vector_math: ^2.3.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.jpg"